name: Compilar APK Offline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repo
        uses: actions/checkout@v4

      - name: Preparar Node.js y Java
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor y preparar carpeta web
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          npx cap add android
          npx cap sync android

      - name: Poner pantalla completa sin barra de estado
        run: |
          python3 -c '
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p).read()
          s = s.replace("</style>", "<item name=\"android:windowFullscreen\">true</item></style>", 1)
          open(p, "w").write(s)
          '

      - name: Compilar APK de Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Contador-Skibidi-Navidad-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

