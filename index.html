<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Contador Skibidi para Navidad</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
<style>
:root{--bg:#05070a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RAMP=' .:-=+*#%@';
let cols,rows,cw,ch,W,H,dpr,t0=performance.now();
function rnd(a,b){return a+Math.random()*(b-a)}
let PTS=[];
function push(x,y,z,r,g,b,bright,amp=0,freq=0,phase=0){PTS.push([x,y,z,r,g,b,bright,amp,freq,phase])}

function buildScene(){
  PTS=[];
  for(let i=0;i<5;i++){
    const frac=i/4,n=Math.max(600,Math.floor(9000*(0.3-0.045*i)));
    const y0=-1.1+frac*2.6,y1=y0+0.55,r0=1.25*(1-frac*0.78),r1=r0*0.35;
    for(let k=0;k<n;k++){
      const yy=rnd(y0,y1),tf=(yy-y0)/(y1-y0),r=r0+(r1-r0)*tf;
      const rad=r*Math.sqrt(rnd(0.35,1)),ang=rnd(0,6.283),edge=rad/r;
      push(rad*Math.cos(ang),yy,rad*Math.sin(ang),10+edge*25,70+edge*110+frac*40,20+edge*30,0.45+0.55*(yy+1.1)/2.6,0.1,rnd(0.6,1.8),rnd(0,6.283));
    }
  }
  for(let k=0;k<1600;k++){
    const yy=rnd(-1.45,-1.05),r=0.22*Math.sqrt(rnd(0.7,1)),ang=rnd(0,6.283);
    push(r*Math.cos(ang),yy,r*Math.sin(ang),92,58,32,0.55);
  }
  for(const ph of [0,Math.PI]) for(let k=0;k<1400;k++){
    const u=k/1400,y=-1.0+u*2.55,br=1.2*(1-u*0.8)*1.03,ang=u*6.4*Math.PI+ph;
    push(br*Math.cos(ang),y,br*Math.sin(ang),255,205,70,0.95);
  }
  const ORN=[[219,40,40],[255,196,40],[60,120,230],[60,170,90]];
  for(let i=0;i<70;i++){
    const frac=rnd(0.04,0.96),y=-1.05+frac*2.5,rt=1.2*(1-frac*0.8)*0.92,ang=rnd(0,6.283);
    const cx=rt*Math.cos(ang),cz=rt*Math.sin(ang),rad=0.09,c=ORN[i%4];
    for(let k=0;k<50;k++){
      const u=rnd(-1,1),th=rnd(0,6.283),r=rad*Math.sqrt(Math.max(0,1-u*u));
      push(cx+r*Math.cos(th),y+rad*u,cz+r*Math.sin(th),c[0],c[1],c[2],0.95);
    }
  }
  for(let i=0;i<380;i++){
    const frac=rnd(0.02,0.98),y=-1.05+frac*2.5,rt=1.2*(1-frac*0.8),ang=rnd(0,6.283);
    const warm=Math.random()<0.5,col=warm?[255,210,90]:[255,130,150];
    push(rt*Math.cos(ang),y,rt*Math.sin(ang),col[0],col[1],col[2],0.9,0.75,3.0,rnd(0,6.283));
  }
  const cy=2.15,outer=0.42,inner=0.17,verts=[];
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?inner:outer;verts.push([r*Math.cos(a),r*Math.sin(a)])}
  verts.push(verts[0]);
  for(let i=0;i<10;i++) for(let k=0;k<120;k++){
    const tt=k/120,x=verts[i][0]+(verts[i+1][0]-verts[i][0])*tt,y=verts[i][1]+(verts[i+1][1]-verts[i][1])*tt;
    push(x+rnd(-.012,.012),cy+y+rnd(-.012,.012),rnd(-0.05,0.05),255,224,110,1.0,0.35,1.6,rnd(0,6.283));
  }
  const GIFTS=[[-1.75,0.55,.42,.34,.42,[122,26,26],[214,214,214]],[-1.3,-0.9,.34,.28,.34,[22,52,99],[181,133,42]],
    [1.55,0.35,.45,.40,.40,[92,21,21],[181,133,42]],[1.1,-1.1,.3,.24,.3,[30,74,30],[214,214,214]]];
  for(const [cx,cz,hw,hh,hd,col,rib] of GIFTS){
    const ybase=-1.45;
    for(let k=0;k<1100;k++){
      const face=Math.floor(rnd(0,6)),u=rnd(-1,1),v=rnd(-1,1);
      let x=0,y=0,z=0;
      if(face===0){x=hw;y=u*hh;z=v*hd} else if(face===1){x=-hw;y=u*hh;z=v*hd}
      else if(face===2){y=hh;x=u*hw;z=v*hd} else if(face===3){y=-hh;x=u*hw;z=v*hd}
      else if(face===4){z=hd;x=u*hw;y=v*hh} else {z=-hd;x=u*hw;y=v*hh}
      const isRib=Math.abs(x/hw)<0.14||Math.abs(z/hd)<0.14||Math.abs(y/hh)<0.12,c=isRib?rib:col;
      push(cx+x,ybase+hh+y,cz+z,c[0],c[1],c[2],0.8);
    }
  }
}
buildScene();

function setup(){
  const w=innerWidth,h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  const font=Math.max(7,Math.min(14,w/150));cw=font*0.6;ch=font*1.05;
  cols=Math.floor(w/cw);rows=Math.floor((h-46)/ch);
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  W=w;H=h;
}
addEventListener('resize',setup);setup();

let snow=[];
for(let i=0;i<550;i++)snow.push({x:Math.random(),y:Math.random(),s:rnd(.2,.6),ph:rnd(0,6.283)});

const TITLE='FELIZ NAVIDAD 2026',PAL=['#ff4d4d','#ffd24d','#ffffff','#5ee05e'];
function diasParaNavidad(){
  const now=new Date();const y=now.getFullYear();
  let xmas=new Date(y,11,25);
  if(now>xmas)xmas=new Date(y+1,11,25);
  return Math.ceil((xmas-now)/864e5);
}
const dias=diasParaNavidad();
const COUNTDOWN=dias<=0?'FELIZ NAVIDAD':(dias===1?'FALTA 1 DIA PARA NAVIDAD':`FALTAN ${dias} DIAS PARA NAVIDAD`);
const SWITCH_T=10.0;
const FOCAL=620,CAM=6.2,ROT=0.5,BUILD=4,TOP=2.5,BOTTOM=-1.45;
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);

function frame(now){
  const t=(now-t0)/1000;
  ctx.fillStyle='#05070a';ctx.fillRect(0,0,W,H);
  const ang=t*ROT,c=Math.cos(ang),s=Math.sin(ang);
  const yThresh=BOTTOM+(TOP-BOTTOM)*ease(t/BUILD);
  const n=cols*rows;
  const depth=new Float32Array(n).fill(1e9),chIdx=new Int8Array(n).fill(-1);
  const colR=new Uint8Array(n),colG=new Uint8Array(n),colB=new Uint8Array(n);
  const cx0=W/2,cy0=rows*ch*0.58;
  for(const p of PTS){
    const[x,y,z,r,g,b,bright,amp,freq,phase]=p;
    if(y>yThresh)continue;
    const rx=x*c+z*s,rz=-x*s+z*c;
    const zc=Math.max(rz+CAM,0.05),sc=FOCAL/zc;
    const sx=rx*sc,sy=y*sc;
    const gx=Math.floor((cx0+sx)/cw),gy=Math.floor((cy0-sy)/ch);
    if(gx<0||gx>=cols||gy<0||gy>=rows)continue;
    const idx=gy*cols+gx;
    if(zc>=depth[idx])continue;
    let br=bright;
    if(amp)br=bright*(1-amp+amp*(0.5+0.5*Math.sin(t*freq+phase)));
    const fog=Math.min(1.15,Math.max(0.35,1.5-zc*0.09));
    br=Math.min(1,br*fog);
    depth[idx]=zc;chIdx[idx]=Math.max(0,Math.min(9,Math.round(br*9)));
    colR[idx]=r;colG[idx]=g;colB[idx]=b;
  }
  ctx.font=`${ch/1.05}px "Courier New",monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
    const idx=gy*cols+gx,ci=chIdx[idx];if(ci<=0)continue;
    ctx.fillStyle=`rgb(${colR[idx]},${colG[idx]},${colB[idx]})`;
    ctx.fillText(RAMP[ci],gx*cw+cw/2,gy*ch+ch/2);
  }
  for(const f of snow){
    f.y+=f.s*0.0028;if(f.y>1)f.y=0;
    const x=((f.x+Math.sin(t*0.5+f.ph)*0.01)%1+1)%1*W,y=f.y*rows*ch;
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x,y,2,2);
  }
  const start=BUILD+1.0;
  const showCountdown=t>=SWITCH_T;
  const txt=showCountdown?COUNTDOWN:TITLE;
  const revealFrom=showCountdown?SWITCH_T:start;
  const nn=Math.floor((t-revealFrom)*12);
  if(nn>0){
    const str=txt.slice(0,nn),y=rows*ch+23;let x=cx0-str.length*ch*0.32;
    for(let i=0;i<str.length;i++){
      if(str[i]!==' '){
        ctx.fillStyle=PAL[(i+Math.floor(t*3))%4];
        ctx.fillText(str[i],x+ch*0.32,y+Math.sin(t*6-i*0.5)*6);
      }
      x+=ch*0.64;
    }
  }
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',()=>{t0=performance.now()});
requestAnimationFrame(frame);
</script>
</body>
</html>
